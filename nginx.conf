server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html referencia los bundles por nombre con hash de contenido
        # (ej. index-DjKAfBcY.js); si el navegador lo cachea, se queda
        # apuntando a un build viejo despues de cada deploy sin que un
        # refresh normal lo note (los assets con hash SI cambian de nombre,
        # pero nunca se piden de nuevo si el html que los referencia esta
        # cacheado).
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
